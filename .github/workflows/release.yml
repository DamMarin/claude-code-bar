name: Release & Publish

# Releases are cut locally with `npm version <patch|minor|major>` followed by
# `git push --follow-tags`, so the tag always points at the version-bump commit.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      # Node 24 ships npm 11, which supports npm trusted publishing (OIDC)
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Release with 'npm version <patch|minor|major>' and 'git push --follow-tags'."
            exit 1
          fi

      - name: Test
        run: npm test

      # Uses trusted publishing when it is configured on npmjs.com, otherwise falls back to NPM_TOKEN.
      # A prerelease such as 1.1.0-beta.1 goes out under its own dist-tag ("beta"), so `latest`
      # stays on the last release; npm refuses to publish a prerelease without one.
      - name: Publish to npm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          case "$VERSION" in
            *-*)
              PRE=${VERSION#*-}
              DIST_TAG=${PRE%%.*}
              # A numeric prerelease (1.1.0-1) can't be a dist-tag, since npm reads it as a version
              case "$DIST_TAG" in [0-9]*|"") DIST_TAG=next ;; esac
              ;;
            *) DIST_TAG=latest ;;
          esac
          npm publish --access public --provenance --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@da05d552573ad5aba039eaac05058a918a7bf631
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
