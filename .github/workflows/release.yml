name: Release & Publish

# Releases are cut locally with `npm version <patch|minor|major>` followed by
# `git push --follow-tags`, so the tag always points at the version-bump commit.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"

# Read-only by default; only the publish job can write
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write # the GitHub release
      id-token: write # npm trusted publishing and provenance

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Node 24 ships npm 11, which supports npm trusted publishing (OIDC)
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"

      - name: Verify tag matches package.json
        run: |
          TAG_VERSION=${GITHUB_REF_NAME#v}
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "$TAG_VERSION" != "$PKG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION. Release with 'npm version <patch|minor|major>' and 'git push --follow-tags'."
            exit 1
          fi

      # The release notes are the tag's section of CHANGELOG.md. A release without one
      # fails here, before anything is published.
      - name: Release notes from CHANGELOG.md
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          awk -v v="$VERSION" '/^## \[/ { p = index($0, "[" v "]") > 0; next } p' CHANGELOG.md > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "::error::CHANGELOG.md has no '## [$VERSION]' section. Add the release notes there first."
            exit 1
          fi

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      # Uses trusted publishing when it is configured on npmjs.com, otherwise falls back to NPM_TOKEN.
      # A prerelease such as 1.1.0-beta.1 goes out under its own dist-tag ("beta"), so `latest`
      # stays on the last release; npm refuses to publish a prerelease without one.
      - name: Publish to npm
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          case "$VERSION" in
            *-*)
              PRE=${VERSION#*-}
              DIST_TAG=${PRE%%.*}
              # A numeric prerelease (1.1.0-1) can't be a dist-tag, since npm reads it as a version
              case "$DIST_TAG" in [0-9]*|"") DIST_TAG=next ;; esac
              ;;
            *) DIST_TAG=latest ;;
          esac
          npm publish --access public --provenance --tag "$DIST_TAG"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          # The CHANGELOG section, followed by the generated list of merged pull requests
          body_path: release-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
